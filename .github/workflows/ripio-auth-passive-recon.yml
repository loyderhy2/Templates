name: Ripio Auth Passive Recon

on:
  push:
    branches: [ master ]
    paths:
      - .github/workflows/ripio-auth-passive-recon.yml
      - security-research/ripio-auth-passive-recon.sh
      - security-research/ripio-auth-mfa-chunk.sh
      - security-research/ripio-app-passive-recon.sh
      - security-research/ripio-app-startup-chunks.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    name: Collect marked public auth artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run low-impact marked auth collector
        shell: bash
        env:
          H1_USERNAME: trekmail
        run: bash security-research/ripio-auth-passive-recon.sh
      - name: Collect referenced public client chunk
        shell: bash
        env:
          H1_USERNAME: trekmail
        run: bash security-research/ripio-auth-mfa-chunk.sh
      - name: Run low-impact marked app collector
        shell: bash
        env:
          H1_USERNAME: trekmail
        run: bash security-research/ripio-app-passive-recon.sh
      - name: Collect directly referenced app startup chunks
        shell: bash
        env:
          H1_USERNAME: trekmail
        run: bash security-research/ripio-app-startup-chunks.sh
      - name: Upload passive auth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripio-auth-passive-recon
          path: ripio-auth-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload referenced client chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripio-auth-mfa-chunk
          path: ripio-auth-mfa-chunk
          if-no-files-found: warn
          retention-days: 7
      - name: Upload passive app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripio-app-passive-recon
          path: ripio-app-passive-recon
          if-no-files-found: warn
          retention-days: 7
      - name: Upload app startup chunks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripio-app-startup-chunks
          path: ripio-app-startup-chunks
          if-no-files-found: warn
          retention-days: 7
