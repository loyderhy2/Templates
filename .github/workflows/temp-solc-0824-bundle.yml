name: Temporary solc 0.8.24 bundle

on:
  push:
    branches:
      - master
    paths:
      - .ci-trigger-solc-0824-bundle

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact public source
        uses: actions/checkout@v4
        with:
          repository: circlefin/buidl-wallet-contracts
          ref: 3c47aa94a8422bbd69a5e71ef21dbaa5ff6e1939
          path: target
          submodules: recursive
          fetch-depth: 1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Install package dependencies
        shell: bash
        run: |
          set -euxo pipefail
          npm install --global yarn@1.22.22
          cd target
          yarn install --frozen-lockfile

      - name: Install exact compiler through Forge
        shell: bash
        run: |
          set -euxo pipefail
          cd target
          forge build --deny never
          test "$(git rev-parse HEAD)" = "3c47aa94a8422bbd69a5e71ef21dbaa5ff6e1939"
          forge --version > ../forge-version.txt
          find "$HOME/.svm" -maxdepth 3 -type f -print | sort > ../svm-files.txt
          SOLC_PATH="$(find "$HOME/.svm" -maxdepth 3 -type f -name '*0.8.24*' -perm -u+x | head -n 1)"
          test -n "$SOLC_PATH"
          cp "$SOLC_PATH" ../solc-0.8.24
          chmod +x ../solc-0.8.24
          ../solc-0.8.24 --version > ../solc-version.txt
          sha256sum ../solc-0.8.24 > ../solc-0.8.24.sha256

      - name: Upload compiler
        uses: actions/upload-artifact@v4
        with:
          name: solc-0.8.24-linux-amd64
          path: |
            solc-0.8.24
            solc-0.8.24.sha256
            solc-version.txt
            forge-version.txt
            svm-files.txt
          if-no-files-found: error
          retention-days: 1
